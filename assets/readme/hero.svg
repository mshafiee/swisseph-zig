<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" role="img" aria-label="swisseph-zig — Swiss Ephemeris in pure Zig. Zodiac wheel with planetary orbit rings on the left, swetest terminal output on the right showing Sun, Moon and planetary longitudes for J2000.">
  <title>swisseph-zig — Swiss Ephemeris in pure Zig</title>
  <desc>Zodiac wheel with planetary orbit rings and Earth-Sun line on the left; swetest terminal output showing Sun, Moon and Mercury ecliptic longitudes for J2000 on the right.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#101623"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.5" r="0.65">
      <stop offset="0" stop-color="#d4a843" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#d4a843" stop-opacity="0"/>
    </radialGradient>
    <style>
      .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .gold { fill: #d4a843; }
      .dim  { fill: #8b949e; }
      .fg   { fill: #e6edf3; }
      .blue { fill: #58a6ff; }
      .orbit { fill: none; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1200" height="420" rx="12" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="12" fill="url(#glow)"/>

  <!-- ─── Left: zodiac wheel / orbit motif ─────────────────────────────── -->
  <g transform="translate(230,210)">
    <!-- outer zodiac ring -->
    <circle r="168" fill="none" stroke="#d4a843" stroke-width="1.5" opacity="0.55"/>
    <circle r="156" fill="none" stroke="#d4a843" stroke-width="0.5" opacity="0.25"/>
    <!-- 12 zodiac sector ticks -->
    <g stroke="#d4a843" stroke-width="1" opacity="0.4">
      <line x1="168" y1="0" x2="156" y2="0" transform="rotate(0)"/>
      <line x1="168" y1="0" x2="156" y2="0" transform="rotate(30)"/>
      <line x1="168" y1="0" x2="156" y2="0" transform="rotate(60)"/>
      <line x1="168" y1="0" x2="156" y2="0" transform="rotate(90)"/>
      <line x1="168" y1="0" x2="156" y2="0" transform="rotate(120)"/>
      <line x1="168" y1="0" x2="156" y2="0" transform="rotate(150)"/>
      <line x1="168" y1="0" x2="156" y2="0" transform="rotate(180)"/>
      <line x1="168" y1="0" x2="156" y2="0" transform="rotate(210)"/>
      <line x1="168" y1="0" x2="156" y2="0" transform="rotate(240)"/>
      <line x1="168" y1="0" x2="156" y2="0" transform="rotate(270)"/>
      <line x1="168" y1="0" x2="156" y2="0" transform="rotate(300)"/>
      <line x1="168" y1="0" x2="156" y2="0" transform="rotate(330)"/>
    </g>
    <!-- zodiac labels -->
    <g class="mono gold" font-size="10" text-anchor="middle" opacity="0.7">
      <text x="0" y="-142" transform="rotate(15 0 0) translate(0 0)" dy="-2" >ARI</text>
      <text x="134" y="-77" transform="rotate(0)" dy="-2">TAU</text>
      <text x="155" y="45" dy="-2">GEM</text>
      <text x="77" y="134" dy="-2">CNC</text>
      <text x="0" y="155" dy="12">LEO</text>
      <text x="-77" y="134" dy="-2">VIR</text>
      <text x="-155" y="45" dy="-2">LIB</text>
      <text x="-134" y="-77" dy="-2">SCO</text>
      <text x="0" y="-142" dy="12">SAG</text>
      <text x="77" y="-134" dy="-2">CAP</text>
      <text x="134" y="-45" dy="-2">AQU</text>
      <text x="155" y="-45" dy="-2">PSC</text>
    </g>
    <!-- planetary orbit rings -->
    <circle r="120" fill="none" stroke="#58a6ff" stroke-width="0.6" opacity="0.3" class="orbit"/>
    <circle r="90"  fill="none" stroke="#58a6ff" stroke-width="0.6" opacity="0.25" class="orbit"/>
    <circle r="62"  fill="none" stroke="#58a6ff" stroke-width="0.6" opacity="0.2" class="orbit"/>
    <circle r="38"  fill="none" stroke="#58a6ff" stroke-width="0.6" opacity="0.15" class="orbit"/>
    <!-- ecliptic plane line -->
    <line x1="-168" y1="0" x2="168" y2="0" stroke="#58a6ff" stroke-width="0.8" opacity="0.35" stroke-dasharray="4 6"/>
    <!-- sun at center -->
    <circle r="7" fill="#d4a843"/>
    <circle r="12" fill="none" stroke="#d4a843" stroke-width="0.6" opacity="0.4"/>
    <circle r="17" fill="none" stroke="#d4a843" stroke-width="0.4" opacity="0.2"/>
    <!-- planets on orbits (J2000 approx ecliptic longitudes) -->
    <!-- Moon 223° -->
    <circle cx="-88" cy="-60" r="3.5" fill="#e6edf3"/>
    <!-- Mercury 272° -->
    <circle cx="4" cy="-60" r="3" fill="#8b949e"/>
    <!-- Venus 242° -->
    <circle cx="-29" cy="-55" r="4" fill="#d4a843"/>
    <!-- Mars 328° -->
    <circle cx="53" cy="-51" r="3.5" fill="#f85149"/>
    <!-- Jupiter 25° -->
    <circle cx="109" cy="51" r="5" fill="#d4a843"/>
    <!-- Saturn 40° -->
    <circle cx="138" cy="77" r="4.5" fill="#e3b341"/>
    <!-- Earth (from center) -->
    <line x1="0" y1="0" x2="-82" y2="71" stroke="#58a6ff" stroke-width="0.8" opacity="0.6"/>
    <circle cx="-82" cy="71" r="4" fill="#58a6ff"/>
    <text x="-76" y="86" class="mono blue" font-size="9" opacity="0.8">EARTH</text>
    <!-- center label -->
    <text y="4" class="mono gold" font-size="9" text-anchor="middle" opacity="0.8">SUN</text>
  </g>

  <!-- ─── Right: title + swetest output ───────────────────────────────── -->
  <g transform="translate(480,58)">
    <!-- eyebrow -->
    <text class="mono dim" font-size="12" letter-spacing="3">SWISS EPHEMERIS · ZIG PORT</text>

    <!-- title -->
    <text y="52" class="sans fg" font-size="52" font-weight="700" letter-spacing="-1">swisseph<tspan class="gold" font-weight="400">-zig</tspan></text>

    <!-- value proposition -->
    <text y="88" class="sans dim" font-size="15">Pure Zig. Bit-for-bit parity with the C oracle.</text>
    <text y="110" class="sans dim" font-size="15">No C dependency for the computation core. WASM-ready.</text>

    <!-- stats row -->
    <g transform="translate(0,148)">
      <rect width="118" height="46" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="59" y="20" text-anchor="middle" class="mono gold" font-size="18" font-weight="700">4.4M</text>
      <text x="59" y="38" text-anchor="middle" class="mono dim" font-size="9">TEST CASES · 0 FAIL</text>

      <rect x="126" width="118" height="46" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="185" y="20" text-anchor="middle" class="mono gold" font-size="18" font-weight="700">107</text>
      <text x="185" y="38" text-anchor="middle" class="mono dim" font-size="9">C-ABI SYMBOLS</text>

      <rect x="252" width="118" height="46" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="311" y="20" text-anchor="middle" class="mono gold" font-size="18" font-weight="700">9</text>
      <text x="311" y="38" text-anchor="middle" class="mono dim" font-size="9">OS/ARCH TARGETS</text>

      <rect x="378" width="118" height="46" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="437" y="20" text-anchor="middle" class="mono blue" font-size="18" font-weight="700">0 C</text>
      <text x="437" y="38" text-anchor="middle" class="mono dim" font-size="9">COMPUTE DEPS</text>
    </g>

    <!-- swetest output panel -->
    <g transform="translate(0,216)">
      <rect width="696" height="136" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
      <rect width="696" height="28" rx="8" fill="#161b22"/>
      <!-- traffic dots -->
      <circle cx="14" cy="14" r="5" fill="#f85149" opacity="0.6"/>
      <circle cx="30" cy="14" r="5" fill="#e3b341" opacity="0.6"/>
      <circle cx="46" cy="14" r="5" fill="#3fb950" opacity="0.6"/>
      <text x="64" y="18" class="mono dim" font-size="10">$ swetest -b1.1.2000 -p0 -fPLBRS -g, -head</text>
      <g class="mono" font-size="11">
        <text x="14" y="48" class="dim">date (dmy) 1.1.2000 greg.   0:00:00 TT    version 2.10.03</text>
        <text x="14" y="66" class="dim">UT:  2451544.499261244   delta t: 63.828499 sec</text>
        <text x="14" y="88" class="fg">Sun    <tspan class="gold">279°51'30.4607</tspan>    0° 0' 0.8266    0.983331864    1° 1' 9.7787</text>
        <text x="14" y="106" class="fg">Moon   <tspan class="gold">217°17'36.1194</tspan>    5°13'53.0223    0.002679809   12° 6'10.7731</text>
        <text x="14" y="124" class="fg">Mercury<tspan class="gold">271° 6'42.4502</tspan>   -0°56'44.2866    1.413694653    1°33'13.5807</text>
      </g>
    </g>

    <!-- bottom metadata -->
    <text x="14" y="344" class="mono dim" font-size="11">AGPL-3.0 / commercial · zig 0.16.x · AGPL-3.0-or-later</text>
  </g>

  <!-- separator line between wheel and content -->
  <line x1="460" y1="40" x2="460" y2="380" stroke="#30363d" stroke-width="1" opacity="0.5"/>
</svg>
