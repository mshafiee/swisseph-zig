name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.16.0"

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # NOTE: mlugg/setup-zig has no node24-native major yet (v2.2.1 latest);
      # its deprecation notice is benign — the pinned runner node is unaffected.
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Cache .zig-cache
        uses: actions/cache@v5
        with:
          path: .zig-cache
          key: zig-ci-${{ env.ZIG_VERSION }}-${{ runner.os }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: zig-ci-${{ env.ZIG_VERSION }}-${{ runner.os }}-
      - name: Zig version
        run: zig version
      - name: Format check
        run: zig fmt --check src/ examples/ test/
      - name: Unit tests (incl. race stress, ephe-gated)
        run: zig build test
      - name: Build (native)
        run: zig build -Doptimize=ReleaseFast
      - name: Smoke test
        shell: bash
        run: |
          if [ -x ./zig-out/bin/swetest.exe ]; then exe=swetest.exe; else exe=swetest; fi
          ./zig-out/bin/$exe -b1.1.2000 -p0 -fPLBRS -g, -head
      - name: Examples
        run: zig build examples
      - name: Cross-build smoke
        if: runner.os == 'Linux'
        run: |
          zig build libswe -Dtarget=aarch64-linux-gnu -Doptimize=ReleaseFast
          zig build libswe -Dtarget=x86_64-windows -Doptimize=ReleaseFast
          zig build libswe -Dtarget=x86_64-macos -Doptimize=ReleaseFast
          zig build libswe -Dtarget=aarch64-macos -Doptimize=ReleaseFast
          zig build libswe -Dtarget=x86_64-freebsd -Doptimize=ReleaseFast
          zig build libswe -Dtarget=aarch64-freebsd -Doptimize=ReleaseFast
          zig build libswe -Dtarget=wasm32-freestanding -Doptimize=ReleaseFast
      - name: WASM end-to-end (VFS, bit-exact vs native pure golden)
        shell: bash
        # Golden is Debug on purpose: optimized native codegen may fuse FMA
        # (x86_64/ARM) while wasm has no FMA instruction; Debug is the
        # contraction-free bit-exact reference for the VFS comparisons.
        run: |
          zig build swe-golden -Doptimize=Debug -Dpure=true
          zig build wasm-test
          node test/wasm/run-all.mjs
